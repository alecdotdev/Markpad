name: Test

on:
  pull_request:
  # Contributors now branch inside this repository instead of a fork, so a
  # commit can reach master without ever having been a pull request. Without
  # this trigger no workflow listens to `push` at all and such a commit is
  # never tested. Restricted to master: pull request branches already run the
  # suite through the `pull_request` trigger above.
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - name: audit complete dependency lockfile
        run: npm audit

      - name: check frontend
        run: npm run check

      - name: run frontend behavior tests
        run: npm test

      - name: run cargo test
        run: |
          cd src-tauri
          cargo test
