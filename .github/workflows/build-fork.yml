name: Build Windows x64 Portable

on:
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm install

      - name: Build Tauri App (No Sign)
        run: npm run tauri build -- --no-sign

      - name: Prepare Executable File
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp src-tauri/target/release/Markpad.exe "Markpad_${VERSION}_x64_Portable.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Markpad-Windows-x64-Portable
          path: Markpad_*_x64_Portable.exe
